<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khuyến mãi - AURA Cafe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
  }
  #root {
    width: 100%; height: 100%;
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 60px;
  }
  .promo-header {
    text-align: center; margin-bottom: 40px;
  }
  .promo-header h1 {
    font-size: 56px; color: #d4a853;
    font-weight: 700; letter-spacing: 2px;
  }
  .promo-header p {
    font-size: 28px; color: rgba(255,255,255,0.6);
    margin-top: 8px;
  }
  .carousel-container {
    position: relative;
    width: 100%; max-width: 1600px;
    flex: 1; display: flex;
    align-items: center; justify-content: center;
  }
  .promo-card {
    position: absolute;
    width: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    opacity: 0;
    transition: opacity 0.6s ease-in-out;
    pointer-events: none;
  }
  .promo-card.active {
    opacity: 1;
    pointer-events: auto;
  }
  .promo-title {
    font-size: 72px; font-weight: 700;
    color: #fff; margin-bottom: 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }
  .promo-discount {
    font-size: 120px; font-weight: 800;
    color: #d4a853;
    text-shadow: 0 4px 20px rgba(212,168,83,0.3);
    margin-bottom: 16px;
  }
  .promo-discount .percent-sign {
    font-size: 60px;
  }
  .promo-description {
    font-size: 36px; color: rgba(255,255,255,0.8);
    margin-bottom: 24px;
  }
  .promo-expiry {
    font-size: 28px; color: rgba(255,255,255,0.5);
  }
  .promo-expiry strong { color: #d4a853; }
  .carousel-indicators {
    position: absolute; bottom: 40px;
    display: flex; gap: 16px;
  }
  .indicator {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all 0.3s;
  }
  .indicator.active { background: #d4a853; transform: scale(1.3); }
  .no-promos {
    font-size: 40px; color: rgba(255,255,255,0.5);
    text-align: center; padding: 60px;
  }
  .error-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(26,26,46,0.95);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
  }
  .error-overlay .error-msg {
    font-size: 40px; color: #d4a853;
    padding: 40px; text-align: center;
  }
  .error-overlay .error-msg .spinner {
    display: inline-block; width: 48px; height: 48px;
    border: 4px solid rgba(212,168,83,0.3);
    border-top-color: #d4a853;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main id="main-content">
<div id="root"></div>
<script>
// CHANGE-ME: Replace with your Cloudflare Worker URL (e.g. https://your-cafe.pages.dev)
const API_BASE = 'https://fnb-caffe-container.pages.dev';
const ROOT = document.getElementById('root');

let carouselInterval = null;

function formatExpiry(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    return 'HSD: ' + d.toLocaleDateString('vi-VN', {
      day: '2-digit', month: '2-digit', year: 'numeric'
    });
  } catch { return ''; }
}

async function renderPromos(data) {
  // data.promos: API returns { code, percent, max_discount, expires_at }
  const promos = data && data.promos ? data.promos : [];
  if (promos.length === 0) {
    ROOT.innerHTML = '<div class="no-promos">Hiện không có chương trình khuyến mãi</div>';
    return;
  }
  let html = '<div class="promo-header"><h1>KHUYẾN MÃI</h1><p>Ưu đãi dành cho bạn</p></div>';
  html += '<div class="carousel-container">';
  for (let i = 0; i < promos.length; i++) {
    const p = promos[i];
    const activeClass = i === 0 ? ' active' : '';
    html += '<div class="promo-card' + activeClass + '" data-index="' + i + '">';
    if (p.percent) {
      html += '<div class="promo-discount">-' + p.percent + '<span class="percent-sign">%</span></div>';
    }
    html += '<div class="promo-title">' + escapeHtml(p.code) + '</div>';
    html += '<div class="promo-expiry"><strong>' + formatExpiry(p.expires_at) + '</strong></div>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="carousel-indicators">';
  for (let i = 0; i < promos.length; i++) {
    const activeClass = i === 0 ? ' active' : '';
    html += '<div class="indicator' + activeClass + '" data-index="' + i + '"></div>';
  }
  html += '</div>';
  ROOT.innerHTML = html;
  startCarousel();
}

function startCarousel() {
  if (carouselInterval) clearInterval(carouselInterval);
  carouselInterval = setInterval(rotateCarousel, 8000);
}

function rotateCarousel() {
  const cards = ROOT.querySelectorAll('.promo-card');
  const dots = ROOT.querySelectorAll('.indicator');
  if (cards.length === 0) return;
  let currentIdx = -1;
  cards.forEach(function(c, i) {
    if (c.classList.contains('active')) currentIdx = i;
  });
  const nextIdx = (currentIdx + 1) % cards.length;
  cards.forEach(function(c) { c.classList.remove('active'); });
  dots.forEach(function(d) { d.classList.remove('active'); });
  if (cards[nextIdx]) cards[nextIdx].classList.add('active');
  if (dots[nextIdx]) dots[nextIdx].classList.add('active');
}

function handlePromoError(err) {
  console.warn('Promo fetch error:', err);
  ROOT.innerHTML = '<div class="error-overlay"><div class="error-msg"><div class="spinner"></div>Đang tải khuyến mãi...</div></div>';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function fetchAndRender() {
  try {
    const res = await fetch(API_BASE + '/api/signage/promos');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    // API returns { success, data } — wrap for renderPromos({ promos })
    const promos = (json && json.data) ? json.data : [];
    await renderPromos({ promos: promos });
  } catch (err) {
    handlePromoError(err);
  }
}

// === AUTO-INIT (stripped in tests) ===
fetchAndRender();
setInterval(fetchAndRender, 60000);
</script>
</main>
</body>
</html>
