# pretix Configuration — Aura Cafe Event Ticketing
# Mount at: /opt/pretix/pretix.cfg (read-only in container)
# Docs: https://docs.pretix.eu/self-hosting/configuration/

[pretix]
instance_name=Aura Cafe Tickets
url=https://tickets.auraspace.cafe
currency=VND
datadir=/data
timezone=Asia/Ho_Chi_Minh
trust_x_forwarded_for=on
trust_x_forwarded_proto=on

[database]
backend=postgresql
name=pretix
user=pretix
password=__CHANGE_ME__
host=pretix_db

[redis]
location=redis://pretix_redis/0
sessions=true

[celery]
backend=redis://pretix_redis/1
broker=redis://pretix_redis/2

[mail]
from=tickets@auraspace.cafe
host=smtp.example.com
user=__CHANGE_ME__
password=__CHANGE_ME__
port=587
tls=on

[storage]
backend=pretix.base.storage.FileSystemStorage
datadir=/data/media
