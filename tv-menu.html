<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
<title>AURA CAFE — Thực Đơn</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/brand-tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-alt: #1a2332;
    --border: #334155;
    --gold: #c9a96e;
    --gold-light: #d4bc8a;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent-green: #22c55e;
    --accent-red: #ef4444;
    --happy-bg: rgba(201, 169, 110, 0.08);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 40px 60px;
  }

  /* ── Header ── */
  .tv-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--gold);
    margin-bottom: 24px;
    flex-shrink: 0;
  }
  .tv-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 52px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.03em;
  }
  .tv-header .subtitle {
    font-size: 18px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-left: 4px;
  }
  .tv-header-right {
    display: flex;
    align-items: center;
    gap: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-muted);
  }
  .tv-header-right .refresh-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    display: inline-block;
    margin-right: 6px;
  }

  /* ── Happy Hour Banner ── */
  .happy-hour-banner {
    background: var(--happy-bg);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 14px 28px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 20px;
    color: var(--gold-light);
    flex-shrink: 0;
    animation: bannerPulse 3s ease-in-out infinite;
  }
  .happy-hour-banner .hh-icon { font-size: 28px; }
  .happy-hour-banner .hh-text { font-weight: 500; }
  .happy-hour-banner .hh-time { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--gold); }
  @keyframes bannerPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }

  /* ── Menu Grid Container ── */
  #tv-menu-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 28px;
    align-content: start;
  }
  /* 3 columns on full HD */
  @media (min-width: 1800px) {
    #tv-menu-container { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 1200px) and (max-width: 1799px) {
    #tv-menu-container { grid-template-columns: repeat(2, 1fr); }
  }

  /* ── Category Card ── */
  .category-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 24px 28px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .category-header {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 600;
    color: var(--gold);
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 2px solid rgba(201, 169, 110, 0.3);
    letter-spacing: 0.02em;
  }
  .category-items { flex: 1; }

  .menu-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid rgba(51, 65, 85, 0.4);
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item-name {
    font-size: 24px;
    font-weight: 400;
    color: var(--text);
    flex: 1;
    padding-right: 16px;
  }
  .menu-item-price {
    font-size: 26px;
    font-weight: 500;
    color: var(--gold-light);
    white-space: nowrap;
    font-family: 'Space Grotesk', sans-serif;
  }

  /* ── Footer ── */
  .tv-footer {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 20px;
    margin-top: 20px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--text-muted);
  }
  .tv-footer .qr-hint {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--gold);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
  }
  .tv-footer .qr-icon { font-size: 24px; }

  /* ── Loading / Error states ── */
  .tv-status {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-size: 28px;
    color: var(--text-muted);
    gap: 12px;
  }
  .tv-status.error { color: var(--accent-red); }
  .tv-status .status-icon { font-size: 40px; }
  .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Scrollbar ── */
  #tv-menu-container::-webkit-scrollbar { width: 6px; }
  #tv-menu-container::-webkit-scrollbar-track { background: transparent; }
  #tv-menu-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<main id="main-content">

<!-- Header -->
<header class="tv-header">
  <div>
    <h1>AURA CAFE</h1>
    <span class="subtitle">Thực Đơn Hôm Nay</span>
  </div>
  <div class="tv-header-right">
    <span><span class="refresh-dot"></span> <span id="lastUpdate">Đang tải...</span></span>
  </div>
</header>

<!-- Happy Hour Banner (shown 14:00-16:00) -->
<div id="happyHourBanner" class="happy-hour-banner" style="display:none">
  <span class="hh-icon">🕐</span>
  <span class="hh-text">HAPPY HOUR — Giảm</span>
  <span class="hh-time">20%</span>
  <span class="hh-text">đồ uống</span>
  <span class="hh-time">14:00 – 16:00</span>
</div>

<!-- Menu Container -->
<div id="tv-menu-container">
  <div class="tv-status">
    <span class="spinner"></span>
    <span>Đang tải thực đơn...</span>
  </div>
</div>

<!-- Footer -->
<footer class="tv-footer">
  <span id="itemCount"></span>
  <span class="qr-hint">
    <span class="qr-icon">📱</span>
    Quét mã QR để đặt món
  </span>
  <span id="syncStatus">🟢 Online</span>
</footer>
</main>

<script>
(function() {
  'use strict';

  const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://localhost:8787/api'
    : 'https://aura-space-worker.sadec-marketing-hub.workers.dev/api';

  const REFRESH_INTERVAL = 60000; // 60 seconds
  const MAX_ERROR_RETRIES = 3;

  let errorCount = 0;
  let currentData = null;

  // ═══════════════════════════════════════════════════════════════════
  // Formatting
  // ═══════════════════════════════════════════════════════════════════

  function formatPrice(price) {
    const n = Number(price);
    if (isNaN(n)) return '0đ';
    return n.toLocaleString('vi-VN') + 'đ';
  }

  function formatTime(date) {
    return date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
  }

  // ═══════════════════════════════════════════════════════════════════
  // Happy Hour detection
  // ═══════════════════════════════════════════════════════════════════

  function isHappyHour() {
    const now = new Date();
    const hours = now.getHours();
    return hours >= 14 && hours < 16;
  }

  function updateHappyHourBanner() {
    const banner = document.getElementById('happyHourBanner');
    if (banner) {
      banner.style.display = isHappyHour() ? 'flex' : 'none';
    }
  }

  // ═══════════════════════════════════════════════════════════════════
  // Data fetching
  // ═══════════════════════════════════════════════════════════════════

  async function fetchMenu() {
    try {
      const res = await fetch(`${API_BASE}/menu?available=true&limit=50`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.success) {
        errorCount = 0;
        return data;
      }
      throw new Error(data.error || 'API returned success: false');
    } catch (err) {
      errorCount++;
      console.error('[TV Menu] Fetch error:', err.message);
      return null;
    }
  }

  // ═══════════════════════════════════════════════════════════════════
  // Rendering
  // ═══════════════════════════════════════════════════════════════════

  function groupByCategory(items) {
    const groups = {};
    items.forEach(function(item) {
      const cat = item.category || 'Khác';
      if (!groups[cat]) { groups[cat] = []; }
      groups[cat].push(item);
    });
    return groups;
  }

  function renderMenu(data) {
    var container = document.getElementById('tv-menu-container');
    if (!container) return;

    var items = data.items || [];
    if (items.length === 0) {
      container.innerHTML = '<div class="tv-status"><span class="status-icon">📋</span><span>Thực đơn hiện chưa có món nào</span></div>';
      document.getElementById('itemCount').textContent = '0 món';
      return;
    }

    var groups = groupByCategory(items);
    var categoryNames = Object.keys(groups).sort();
    var totalItems = items.length;

    var html = '';
    categoryNames.forEach(function(cat) {
      html += '<div class="category-card">';
      html += '<h2 class="category-header">' + escHtml(cat) + '</h2>';
      html += '<div class="category-items">';
      groups[cat].forEach(function(item) {
        html += '<div class="menu-item">';
        html += '<span class="menu-item-name">' + escHtml(item.name) + '</span>';
        html += '<span class="menu-item-price">' + formatPrice(item.price) + '</span>';
        html += '</div>';
      });
      html += '</div></div>';
    });

    container.innerHTML = html;
    document.getElementById('itemCount').textContent = totalItems + ' món';
    currentData = data;
  }

  function showError() {
    var container = document.getElementById('tv-menu-container');
    if (!container) return;

    // Keep showing old data if available
    if (currentData) {
      document.getElementById('syncStatus').innerHTML = '🟡 Cập nhật lỗi';
      return;
    }

    container.innerHTML = '<div class="tv-status error"><span class="status-icon">⚠</span><span>Không thể tải thực đơn. Đang thử lại...</span></div>';
    document.getElementById('syncStatus').innerHTML = '🔴 Lỗi kết nối';
  }

  function updateTimestamp() {
    var el = document.getElementById('lastUpdate');
    if (el) { el.textContent = 'Cập nhật: ' + formatTime(new Date()); }
    updateHappyHourBanner();
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ═══════════════════════════════════════════════════════════════════
  // Main loop
  // ═══════════════════════════════════════════════════════════════════

  async function loadAndRender() {
    var data = await fetchMenu();
    if (data) {
      renderMenu(data);
      document.getElementById('syncStatus').innerHTML = '🟢 Online';
    } else if (errorCount >= MAX_ERROR_RETRIES) {
      showError();
    }
    updateTimestamp();
  }

  // Initial load
  loadAndRender();

  // Auto-refresh
  setInterval(loadAndRender, REFRESH_INTERVAL);

  // Also check happy hour on the hour
  setInterval(updateHappyHourBanner, 60000);
})();
</script>

</body>
</html>
