<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>KDS · AURA CAFE Kitchen</title>
  <!-- preconnect to font servers -->

  <!-- preload critical font files (WOFF2 format) -->

  <link rel="stylesheet" href="css/brand-tokens.css">
  <link rel="stylesheet" href="css/kds-m3.css?v=2.2.1">
  <link rel="stylesheet" href="css/kds-styles.css?v=2.2.1">
  <link rel="icon" type="image/svg+xml" href="a
    <link rel="stylesheet" href="/css/public.css">
ssets/brand/favicon.svg">
  <link rel="manifest" href="public/manifest.json">
  <link rel="stylesheet" href="kds.css">
    <meta name="theme-color" content="#1A1A2E">
</head>
<body>
  <header class="kds-header">
    <div class="kds-brand"><span>🍳</span><b>AURA</b>&nbsp;KDS</div>
    <div class="kds-clock" id="kdsClock">--:--:--</div>
    <div class="kds-stats">
      <div>Chờ: <b id="statPending">0</b></div>
      <div>Đang làm: <b id="statPreparing">0</b></div>
      <div>Sẵn sàng: <b id="statReady">0</b></div>
      <div>Avg: <b id="statAvgTime">0m</b></div>
    </div>
    <div class="kds-controls">
      <button class="kds-btn" id="toggleSound" title="Toggle sound">🔔</button>
      <button class="kds-btn" id="toggleFullscreen" title="Toàn màn hình">⛶</button>
      <button class="kds-btn" id="refreshKDS" title="Refresh">↻</button>
    </div>
  </header>

  <h1 class="sr-only">AURA KDS — Kitchen Display System</h1>
  <main class="kds-board" id="kdsBoard">
    <div class="kds-col" data-col="pending">
      <h3>Chờ xác nhận <span id="cntPending">0</span></h3>
      <div class="kds-cards" id="colPending"><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div></div>
    </div>
    <div class="kds-col" data-col="preparing">
      <h3>Đang chuẩn bị <span id="cntPreparing">0</span></h3>
      <div class="kds-cards" id="colPreparing"><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div></div>
    </div>
    <div class="kds-col" data-col="ready">
      <h3>Sẵn sàng <span id="cntReady">0</span></h3>
      <div class="kds-cards" id="colReady"><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div></div>
    </div>
    <div class="kds-col" data-col="served">
      <h3>Đã phục vụ <span id="cntServed">0</span></h3>
      <div class="kds-cards" id="colServed"><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div></div>
    </div>
  </main>

  <div class="toast-dock" id="toastDock"></div>

  <script type="module" src="js/kds-app.js?v=2.2.2"></script>
<button id="themeToggle" onclick="window._theme.toggle()" aria-label="Toggle dark mode" style="position:fixed;bottom:16px;right:16px;z-index:9999;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;" title="Chuyển đổi giao diện">🌓</button>
<script>
(function(){var t=localStorage.getItem('theme')||'light';function a(){document.documentElement.setAttribute('data-theme',t);var e=document.getElementById('themeToggle');if(e)e.textContent=t==='dark'?'🌞':'🌙'}a();window._theme={toggle:function(){t=t==='light'?'dark':'light';localStorage.setItem('theme',t);a()}}})();
</script>
</body>
</html>
