<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mất kết nối — Offline</title>
  <style>
    body {
      font-family: 'Be Vietnam Pro', -apple-system, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0E1322;
      color: #E4E1E9;
    }
    .card {
      text-align: center;
      padding: 2rem;
      background: #1A1F2F;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
    }
    .icon { font-size: 4rem; }
    button {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      background: #FFB95A;
      color: #462A00;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Không có kết nối / Offline</h1>
    <p>Vui lòng kiểm tra mạng để tiếp tục.</p>
    <button onclick="location.reload()">Thử lại / Retry</button>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
