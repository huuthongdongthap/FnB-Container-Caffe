<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khách hàng | AURA CAFE Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1A2E">
<link rel="stylesheet" href="../admin/shared.css">
<link rel="icon" type="image/svg+xml" href="/public/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/odoo-sync.css">
<style>
:root { --bg: #0f172a; --surface: #1e293b; --border: #334155; --gold: #c9a96e; --text: #e2e8f0; --text-muted: #94a3b8; --green: #22c55e; --red: #ef4444; --amber: #f59e0b; }
body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; margin: 0; padding: 20px; min-height: 100vh; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.page-header h1 { font-family: 'Cormorant Garamond', serif; color: var(--gold); font-size: 28px; margin: 0; }
.back-link { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: color .2s; }
.back-link:hover { color: var(--gold); }
.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar input { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 14px; min-width: 240px; }
.toolbar input::placeholder { color: var(--text-muted); }
.mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
.badge-tier { background: rgba(201,169,110,.15); color: var(--gold); }
.badge-synced { background: rgba(34,197,94,.15); color: var(--green); }
.badge-not-synced { background: rgba(148,163,184,.15); color: var(--text-muted); }
.table-wrap { overflow-x: auto; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; min-width: 800px; }
th { text-align: left; padding: 12px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 500; }
td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid rgba(51,65,85,.4); vertical-align: middle; }
tr:hover td { background: rgba(201,169,110,.04); }
.cust-name { color: var(--text); font-weight: 500; cursor: pointer; transition: color .2s; }
.cust-name:hover { color: var(--gold); text-decoration: underline; }
.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 9999; display: none; max-width: 400px; }
.toast-success { background: #166534; color: #dcfce7; }
.toast-error { background: #7f1d1d; color: #fecaca; }

/* ERPNext detail panel */
.detail-panel { display: none; margin-top: 20px; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
.detail-panel.open { display: block; }
.detail-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.detail-header h3 { margin: 0; font-family: 'Cormorant Garamond', serif; color: var(--gold); font-size: 20px; }
.detail-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; padding: 4px 8px; }
.detail-close:hover { color: var(--red); }
.detail-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 768px) { .detail-body { grid-template-columns: 1fr; } }
.detail-section { background: var(--bg); border-radius: 8px; padding: 16px; border: 1px solid rgba(51,65,85,.3); }
.detail-section h4 { margin: 0 0 12px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.tag-loyalty { background: rgba(201,169,110,.15); color: var(--gold); }
.tag-crm { background: rgba(107,159,184,.15); color: #6b9fb8; }
.note-item { padding: 10px 0; border-bottom: 1px solid rgba(51,65,85,.3); }
.note-item:last-child { border-bottom: none; }
.note-date { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.note-body { font-size: 13px; color: var(--text); line-height: 1.5; }
.sync-info { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.sync-dot.green { background: var(--green); }
.sync-dot.grey { background: var(--text-muted); }
.loading-spin { display: inline-block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="page-header">
<h1>Khách hàng — ERPNext CRM</h1>
<a href="orders.html" class="back-link">&larr; Quay lại Orders</a>
</div>
<div class="toolbar">
<input type="text" id="searchInput" placeholder="Tìm theo tên, SĐT, email..." oninput="filterCustomers()">
<span id="count" class="mono" style="color: var(--text-muted);"></span>
</div>
<div class="table-wrap">
<div id="empty" class="empty" style="display:none">
<div class="empty-icon">👥</div>
<div>Không tìm thấy khách hàng</div>
</div>
<table id="table" style="display:none">
<thead>
<tr>
<th>Khách hàng</th>
<th>SĐT</th>
<th>Loyalty</th>
<th>ERPNext Sync</th>
<th>Ngày tham gia</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<!-- ERPNext detail panel -->
<div class="detail-panel" id="detailPanel">
<div class="detail-header">
<h3 id="detailTitle">ERPNext CRM — </h3>
<button class="detail-close" onclick="closeDetail()" title="Đóng">&times;</button>
</div>
<div class="detail-body" id="detailBody"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://127.0.0.1:8787/api' : location.origin.replace(':3000','') + '';

let allCustomers = [];

function authHeaders() {
  const t = localStorage.getItem('aura_token');
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t };
}

function showToast(msg, type) {
  type = type || 'success';
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast toast-' + type;
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 3000);
}

async function loadCustomers() {
  try {
    const res = await fetch(API + '/admin/customers', { headers: authHeaders() });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Unknown error');
    allCustomers = data.customers || [];
    render(allCustomers);
  } catch (e) {
    showToast('Lỗi tải danh sách: ' + e.message, 'error');
  }
}

function render(list) {
  const tbody = document.getElementById('tbody');
  const table = document.getElementById('table');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');

  count.textContent = list.length + ' khách hàng';

  if (!list.length) {
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  table.style.display = 'table';
  empty.style.display = 'none';

  tbody.innerHTML = list.map(function(c) {
    var tierLabel = c.loyalty_tier || 'bronze';
    var syncedHtml = c.erpnext_synced
      ? '<span class="sync-dot green" title="Đã đồng bộ"></span> <span class="badge badge-synced">Đã sync</span>'
      : '<span class="sync-dot grey" title="Chưa đồng bộ"></span> <span class="badge badge-not-synced">Chưa sync</span>';
    var nameHtml = '<span class="cust-name" onclick="showERPNextDetail(\'' + escapeHtml(c.id) + '\', \'' + escapeHtml(c.name || '') + '\')">' + escapeHtml(c.name || '—') + '</span>';
    return '<tr>' +
      '<td>' + nameHtml + '<div style="font-size:12px;color:var(--text-muted)">' + escapeHtml(c.email || '') + '</div></td>' +
      '<td class="mono">' + escapeHtml(c.phone || '—') + '</td>' +
      '<td><span class="badge badge-tier">' + escapeHtml(tierLabel) + '</span></td>' +
      '<td>' + syncedHtml + '</td>' +
      '<td class="mono">' + (c.created_at ? new Date(c.created_at).toLocaleDateString('vi-VN') : '—') + '</td>' +
      '</tr>';
  }).join('');
}

function filterCustomers() {
  var q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  if (!q) { render(allCustomers); return; }
  var filtered = allCustomers.filter(function(c) {
    return (c.name || '').toLowerCase().indexOf(q) >= 0 ||
           (c.phone || '').indexOf(q) >= 0 ||
           (c.email || '').toLowerCase().indexOf(q) >= 0;
  });
  render(filtered);
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
}

// ── ERPNext CRM detail ──

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
}

async function showERPNextDetail(customerId, name) {
  var panel = document.getElementById('detailPanel');
  var title = document.getElementById('detailTitle');
  var body = document.getElementById('detailBody');

  title.textContent = 'ERPNext CRM — ' + (name || customerId);
  body.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted)"><span class="loading-spin">⏳</span> Đang tải dữ liệu ERPNext...</div>';
  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth' });

  try {
    var res = await fetch(API + '/erpnext/customers/' + customerId + '/notes', { headers: authHeaders() });
    var data = await res.json();
    if (!data.success) {
      body.innerHTML = renderNoERPNext(data.error || 'Không có dữ liệu ERPNext');
      return;
    }
    body.innerHTML = renderERPNextDetail(data);
  } catch (e) {
    body.innerHTML = renderNoERPNext('Lỗi kết nối: ' + e.message);
  }
}

function renderERPNextDetail(data) {
  var tagsHtml = '';
  if (data.tags && data.tags.length) {
    tagsHtml = '<div class="tag-list">' + data.tags.map(function(t) {
      return '<span class="tag tag-crm">' + escapeHtml(t) + '</span>';
    }).join('') + '</div>';
  } else {
    tagsHtml = '<p style="color:var(--text-muted);font-size:13px">Chưa có tag CRM</p>';
  }

  var notesHtml = '';
  if (data.notes && data.notes.length) {
    notesHtml = data.notes.map(function(n) {
      return '<div class="note-item"><div class="note-date">' + (n.date ? new Date(n.date).toLocaleString('vi-VN') : '—') + '</div><div class="note-body">' + escapeHtml(n.body || n.content || '') + '</div></div>';
    }).join('');
  } else {
    notesHtml = '<p style="color:var(--text-muted);font-size:13px">Chưa có ghi chú CRM</p>';
  }

  var lastActivity = data.lastActivity
    ? '<div class="sync-info"><span class="sync-dot green"></span> Hoạt động cuối: ' + new Date(data.lastActivity).toLocaleString('vi-VN') + '</div>'
    : '<div class="sync-info"><span class="sync-dot grey"></span> Chưa có hoạt động</div>';

  return '<div class="detail-section"><h4>🏷 Tags CRM</h4>' + tagsHtml + '</div>' +
         '<div class="detail-section"><h4>📝 Ghi chú CRM</h4>' + notesHtml + '</div>' +
         '<div class="detail-section"><h4>📊 Trạng thái</h4>' + lastActivity +
         '<div class="sync-info" style="margin-top:6px">Partner ID: <code class="mono">' + (data.partnerId || '—') + '</code></div></div>';
}

function renderNoERPNext(msg) {
  return '<div style="text-align:center;padding:24px;color:var(--text-muted)">' +
         '<div style="font-size:36px;margin-bottom:8px">🔗</div>' +
         '<p>' + escapeHtml(msg) + '</p>' +
         '<p style="font-size:12px">Khách hàng này chưa được đồng bộ với ERPNext CRM. Tạo lead từ ERPNext Admin để bắt đầu.</p>' +
         '</div>';
}

loadCustomers();
document.getElementById('searchInput').addEventListener('input', filterCustomers);
</script>
</body>
</html>
