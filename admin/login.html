<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập — AURA CAFE Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1A1A2E">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon-B1hE6VMY.svg">
    <link rel="stylesheet" href="shared.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-brand">
            <span class="logo-icon">☕</span>
            <h1><img src="../assets/brand/web/logo-256.png" alt="" style="height:36px;vertical-align:middle;margin-right:8px;" loading="lazy">AURA CAFE</h1>
            <p>ADMIN · STAFF PORTAL</p>
        </div>

        <div class="login-card">
            <h2>Đăng Nhập</h2>
            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="admin@auraspace.vn" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Mật Khẩu</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="btnLogin">Đăng Nhập</button>
                <div class="login-error" id="loginError"></div>
            </form>
        </div>

        <div class="login-footer">
            <a href="/index.html">← Về Trang Chủ</a>
        </div>
    </div>

    <script>
    (function() {
        // Legacy migration: admin_token → aura_auth_token
        const _legacy = localStorage.getItem('admin_token');
        if (_legacy && !localStorage.getItem('aura_auth_token')) {
            localStorage.setItem('aura_auth_token', _legacy);
            const _legacyUser = localStorage.getItem('admin_user');
            if (_legacyUser) localStorage.setItem('aura_auth_user', _legacyUser);
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
        }

        // If already logged in with admin token, go to dashboard
        const existingToken = localStorage.getItem('aura_auth_token');
        if (existingToken) {
            window.location.replace('/admin/dashboard.html');
            return;
        }

        const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        const API_BASE = IS_LOCAL
            ? 'http://127.0.0.1:8787'
            : 'https://aura-space-worker.sadec-marketing-hub.workers.dev';

        const form = document.getElementById('loginForm');
        const btn = document.getElementById('btnLogin');
        const errorEl = document.getElementById('loginError');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorEl.textContent = '';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Đang xác thực...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Đăng nhập thất bại');
                }

                const role = data.user?.role || 'customer';
                if (role !== 'owner' && role !== 'staff') {
                    throw new Error('Tài khoản không có quyền truy cập Admin');
                }

                localStorage.setItem('aura_auth_token', data.token);
                localStorage.setItem('aura_auth_user', JSON.stringify(data.user));

                btn.innerHTML = '✓ Thành công!';
                btn.style.background = 'var(--success)';
                btn.style.color = '#fff';

                setTimeout(function() {
                    window.location.replace('/admin/dashboard.html');
                }, 600);

            } catch (err) {
                errorEl.textContent = err.message;
                btn.disabled = false;
                btn.innerHTML = 'Đăng Nhập';
            }
        });
    })();
    </script>
<button id="themeToggle" onclick="window._theme.toggle()" aria-label="Toggle dark mode" style="position:fixed;bottom:16px;right:16px;z-index:9999;width:44px;height:44px;border-radius:50%;border:1px solid #ccc;background:#fff;color:#333;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;" title="Chuyển đổi giao diện">🌓</button><script>(function(){var t=localStorage.getItem("theme")||"dark";function a(){document.documentElement.setAttribute("data-theme",t);var e=document.getElementById("themeToggle");if(e)e.textContent=t==="dark"?"🌞":"🌙"}a();window._theme={toggle:function(){t=t==="light"?"dark":"light";localStorage.setItem("theme",t);a()}}})();</script></body>
</html>
