<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✅ Approve Check-in — AURA Admin</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1A2E">
    <link rel="stylesheet" href="../admin/shared.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">


<!-- ══ SIDEBAR ══ -->
<div class="sidebar" id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-text">AURA</div>
    <div class="sb-logo-sub">CAFE Admin</div>
  </div>
  <nav class="sb-nav">
    <a href="../admin/dashboard.html" class="sb-item"><span class="icon">📊</span>Dashboard</a>
    <a href="../admin/orders.html" class="sb-item"><span class="icon">📦</span>Đơn hàng</a>
    <a href="reservations.html" class="sb-item"><span class="icon">📅</span>Đặt bàn</a>
    <a href="menu.html" class="sb-item"><span class="icon">☕</span>Thực đơn</a>
    <a href="staff.html" class="sb-item"><span class="icon">👥</span>Nhân viên</a>
    <a href="pos.html" class="sb-item"><span class="icon">🖥️</span>POS</a>
    <a href="checkin-approve.html" class="sb-item active"><span class="icon">✅</span>Check-in</a>
    <a href="../index.html" class="sb-item"><span class="icon">🏠</span>Về trang chủ</a>
  </nav>
  <div class="sb-user">
    <div class="sb-avatar">A</div>
    <div><div class="sb-user-name">Admin</div><div class="sb-user-role">Owner</div></div>
  </div>
</div>
<div class="sb-overlay" id="sbOverlay"></div>
</head>
<body>
<div class="main">
<div class="content">
<div class="container">
  <div class="header">
    <button class="hamburger" id="hamburger" style="background:none;border:none;color:var(--chrome-steel);font-size:clamp(1.2rem,4vw,1.6rem);cursor:pointer;padding:4px 8px;-webkit-tap-highlight-color:transparent;display:flex;align-items:center">☰</button>
    <h1>Check-in Approve</h1>
    <p>Staff approve khách post FB/Zalo → grant reward</p>
  </div>

  <div class="nav">
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/pos.html">POS</a>
    <a href="/admin/checkin-approve.html" class="active">Check-in</a>
    
  </div>

  <!-- Stats today -->
  <div class="stats" id="statsContainer">
    <div class="stat-card">
      <div class="num" id="statTotal">—</div>
      <div class="label">Check-in hôm nay</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statPoints">—</div>
      <div class="label">+20k cashback</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statDiscount">—</div>
      <div class="label">-10% discount</div>
    </div>
  </div>

  <!-- Approve form -->
  <div class="card">
    <h2>🆕 Approve Check-in mới</h2>

    <div class="input-group">
      <label>SĐT khách</label>
      <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="0901234567" autocomplete="off">
    </div>

    <button class="btn btn-full" id="btnLookup">🔍 Tìm khách</button>

    <div id="customerSection" class="hidden">
      <div class="customer-info" id="customerInfo"></div>

      <div class="input-group" style="margin-top: 16px;">
        <label>Platform khách post</label>
        <select id="postPlatform">
          <option value="FB">Facebook</option>
          <option value="ZALO">Zalo</option>
          <option value="IG">Instagram</option>
          <option value="OTHER">Khác</option>
        </select>
      </div>

      <div class="input-group">
        <label>Link post (optional)</label>
        <input type="url" id="postUrl" inputmode="url" autocomplete="url" placeholder="https://facebook.com/...">
      </div>

      <div class="input-group">
        <label>Đơn liên kết (chỉ Phase 2 discount 10%)</label>
        <input type="text" id="orderId" inputmode="text" autocomplete="off" placeholder="ORD_xxx (optional)">
      </div>

      <div class="input-group">
        <label>Ghi chú</label>
        <textarea id="notes" rows="2" placeholder="Tùy chọn"></textarea>
      </div>

      <button class="btn btn-full" id="btnApprove" style="background: var(--success); color: var(--bg);">
        ✅ Approve check-in
      </button>
    </div>

    <div id="resultMsg"></div>
  </div>

  <!-- Recent check-ins -->
  <div class="card">
    <h2>📋 Check-in hôm nay</h2>
    <div class="recent-list" id="recentList">
      <div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
    </div>
  </div>
</div>

<script>
const API_BASE = '';
let staffToken = null;
let currentCustomer = null;

const $ = (id) => document.getElementById(id);

// Get staff JWT from localStorage (set by login flow)
function getToken() {
  staffToken = localStorage.getItem('admin_token') || localStorage.getItem('staff_token') || localStorage.getItem('auth_token');
  if (!staffToken) {
    alert('Vui lòng đăng nhập admin trước');
    location.href = '/admin/login.html';
    return false;
  }
  return true;
}

function fmtVND(n) {
  return new Intl.NumberFormat('vi-VN').format(Math.round(n)) + 'đ';
}

// Stats
async function loadStats() {
  try {
    const res = await fetch(`${API_BASE}/api/loyalty/checkin/today`, {
      headers: { Authorization: `Bearer ${staffToken}` }
    });
    const data = await res.json();
    if (data.success) {
      $('statTotal').textContent = data.summary.total;
      $('statPoints').textContent = data.summary.points_20k_count;
      $('statDiscount').textContent = data.summary.discount_10pct_count;

      // Recent list
      const list = $('recentList');
      if (data.data.length === 0) {
        list.innerHTML = '<p style="color: var(--txt); text-align: center;">Chưa có check-in nào hôm nay</p>';
      } else {
        list.innerHTML = data.data.map(item => `
          <div class="recent-item">
            <div class="info">
              <div class="name">${item.customer_name || '—'}</div>
              <div class="meta">${item.customer_phone || '—'} · ${item.post_platform} · ${new Date(item.checkin_at).toLocaleTimeString('vi-VN')}</div>
            </div>
            <div class="reward">${item.reward_type === 'POINTS_20K' ? '+20k' : '-10%'}</div>
          </div>
        `).join('');
      }
    }
  } catch (err) {
    console.error('Stats error:', err);
  }
}

// Lookup customer by phone
$('btnLookup').addEventListener('click', async () => {
  const phone = $('phone').value.trim();
  if (!/^0\d{9,10}$/.test(phone)) {
    alert('Vui lòng nhập SĐT hợp lệ');
    return;
  }

  $('btnLookup').disabled = true;
  $('btnLookup').textContent = 'Đang tìm...';
  $('resultMsg').innerHTML = '';

  try {
    const res = await fetch(`${API_BASE}/api/loyalty/lookup?phone=${encodeURIComponent(phone)}`);
    const data = await res.json();

    if (!data.success || !data.member) {
      $('resultMsg').innerHTML = '<div class="alert alert-danger">❌ Không tìm thấy khách. Khách cần đăng ký thành viên trước.</div>';
      return;
    }

    currentCustomer = data.member;
    const tierClass = `tier-${currentCustomer.tier || 'bronze'}`;
    const tierName = { bronze: 'Đồng', silver: 'Bạc', gold: 'Vàng', platinum: 'Bạch Kim' }[currentCustomer.tier] || currentCustomer.tier;

    $('customerInfo').innerHTML = `
      <div class="row"><span class="label">Tên</span><span class="value"><strong>${currentCustomer.name}</strong></span></div>
      <div class="row"><span class="label">SĐT</span><span class="value">${currentCustomer.phone}</span></div>
      <div class="row"><span class="label">Tier</span><span class="value"><span class="tier-badge ${tierClass}">${tierName}</span></span></div>
      <div class="row"><span class="label">Ví hiện tại</span><span class="value">${fmtVND(currentCustomer.cashback_balance || 0)}</span></div>
    `;

    // Check eligibility
    const elig = await fetch(`${API_BASE}/api/loyalty/checkin/eligibility/${currentCustomer.member_id}`);
    const eligData = await elig.json();

    if (!eligData.eligible) {
      let msg;
      if (eligData.reason === 'already_checked_in_this_month') {
        msg = '⚠️ Khách đã check-in tháng này rồi.';
      } else if (eligData.reason === 'no_active_campaign') {
        msg = '⚠️ Không có campaign check-in active.';
      } else {
        msg = '⚠️ ' + (eligData.message || 'Khách chưa đủ điều kiện');
      }
      $('resultMsg').innerHTML = `<div class="alert alert-warn">${msg}</div>`;
      $('customerSection').classList.remove('hidden');
      $('btnApprove').disabled = true;
      $('btnApprove').textContent = '🚫 Không thể approve';
      $('btnApprove').style.background = 'var(--txt)';
      return;
    }

    const rewardText = eligData.campaign.reward_type === 'POINTS_20K'
      ? `Sẽ cộng +20.000đ vào ví`
      : `Sẽ giảm 10% đơn hiện tại`;

    $('resultMsg').innerHTML = `<div class="alert alert-success">✅ Đủ điều kiện check-in. ${rewardText}</div>`;
    $('customerSection').classList.remove('hidden');
    $('btnApprove').disabled = false;
    $('btnApprove').textContent = '✅ Approve check-in';
    $('btnApprove').style.background = 'var(--success)';

  } catch (err) {
    $('resultMsg').innerHTML = `<div class="alert alert-danger">Lỗi: ${err.message}</div>`;
  } finally {
    $('btnLookup').disabled = false;
    $('btnLookup').textContent = '🔍 Tìm khách';
  }
});

// Approve check-in
$('btnApprove').addEventListener('click', async () => {
  if (!currentCustomer) return;

  $('btnApprove').disabled = true;
  $('btnApprove').textContent = 'Đang approve...';

  try {
    const body = {
      customer_id: currentCustomer.member_id,
      post_platform: $('postPlatform').value,
      post_url: $('postUrl').value.trim() || null,
      order_id: $('orderId').value.trim() || null,
      notes: $('notes').value.trim() || null,
    };

    const res = await fetch(`${API_BASE}/api/loyalty/checkin`, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${staffToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (data.success) {
      $('resultMsg').innerHTML = `<div class="alert alert-success">🎉 ${data.data.message}</div>`;
      // Reset form
      setTimeout(() => {
        $('phone').value = '';
        $('postUrl').value = '';
        $('orderId').value = '';
        $('notes').value = '';
        $('customerSection').classList.add('hidden');
        currentCustomer = null;
        loadStats();
      }, 2000);
    } else {
      $('resultMsg').innerHTML = `<div class="alert alert-danger">❌ ${data.message || data.error}</div>`;
      $('btnApprove').disabled = false;
      $('btnApprove').textContent = '✅ Approve check-in';
    }
  } catch (err) {
    $('resultMsg').innerHTML = `<div class="alert alert-danger">Lỗi: ${err.message}</div>`;
    $('btnApprove').disabled = false;
  }
});

// Init
window.addEventListener('load', () => {
  if (!getToken()) return;
  loadStats();
  $('phone').focus();
  // Refresh stats every 30s
  setInterval(loadStats, 30000);
});
</script>

<!-- ══ MOBILE SIDEBAR ══ -->
<script>
(function(){
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sbOverlay');
  if (!sidebar || !overlay) return;
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
  document.querySelector('.hamburger')?.addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);
  document.querySelectorAll('.sb-item').forEach(item => {
    item.addEventListener('click', () => { if (window.innerWidth <= 768) closeSidebar(); });
  });
})();
</script>
</div>
</div>
</div>
<button id="themeToggle" onclick="window._theme.toggle()" aria-label="Toggle dark mode" style="position:fixed;bottom:16px;right:16px;z-index:9999;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;" title="Chuyển đổi giao diện">🌓</button>
<script>
(function(){var t=localStorage.getItem('theme')||'light';function a(){document.documentElement.setAttribute('data-theme',t);var e=document.getElementById('themeToggle');if(e)e.textContent=t==='dark'?'🌞':'🌙'}a();window._theme={toggle:function(){t=t==='light'?'dark':'light';localStorage.setItem('theme',t);a()}}})();
</script>
</body></html>
