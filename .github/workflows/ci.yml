name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    env:
      TZ: UTC

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      run: |
        npm ci
        cd worker && npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Validate D1 Migration Sequence
      run: npm run lint:migrations

    - name: Validate MD3 Contrast Ratios
      run: npm run check:contrast

    - name: Type check (all projects)
      run: npm run typecheck:all

    - name: Run tests
      run: npm run test:ci

    - name: Run Live Worker Payment & Security Loopback Harness
      run: node scripts/local-payment-flow/run.mjs --api-only

    - name: Production Bundle Build
      run: npm run build

  e2e-smoke:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    env:
      TZ: UTC
      VITE_API_BASE: ''

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run Store Operations E2E Smoke
      run: npx playwright test tests/playwright/store-operations-go-live.spec.ts --project="Desktop Chrome"
