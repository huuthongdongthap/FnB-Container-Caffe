name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action to execute'
        required: true
        type: choice
        options:
          - apply-d1-migration
          - deploy-pages
          - worker-canary-10
          - worker-promote-100
          - worker-rollback
        default: worker-canary-10
      migration_file:
        description: 'Canonical forward D1 migration file in worker/db/migrations/ (required when action is apply-d1-migration, e.g. 20261118_01_orders_loyalty_points_redeemed.sql)'
        required: false
        type: string
        default: ''
      worker_version_id:
        description: 'Candidate Worker Version ID (required for worker-promote-100; optional for specific rollback target)'
        required: false
        type: string
        default: ''
      baseline_version_id:
        description: 'Baseline Worker Version ID for 90% canary (leave blank to auto-detect active production version)'
        required: false
        type: string
        default: ''
      rollback_reason:
        description: 'Rollback message/reason (used when action is worker-rollback)'
        required: false
        type: string
        default: 'Emergency production rollback via GitHub Actions'

env:
  MIGRATION_FILE_INPUT: ${{ inputs.migration_file }}
  BASELINE_VERSION_ID: ${{ inputs.baseline_version_id }}
  WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
  ROLLBACK_REASON_INPUT: ${{ inputs.rollback_reason }}

jobs:
  apply-d1-migration:
    name: Backup & Apply Explicit D1 Migration
    if: ${{ inputs.action == 'apply-d1-migration' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root & worker dependencies
        run: |
          npm ci --silent
          cd worker && npm ci --silent

      - name: Validate migration file & export pre-migration D1 backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: |
          set -euo pipefail
          if ! printf '%s' "$MIGRATION_FILE_INPUT" | grep -Eq '^[0-9]{8}_[0-9]{2}_[a-z0-9_]+\.sql$'; then
            echo "Error: invalid migration_file format (expected YYYYMMDD_NN_slug.sql)" >&2
            exit 1
          fi
          bash worker/scripts/apply-migrations.sh --dry-run --file "$MIGRATION_FILE_INPUT"
          mkdir -p d1-backups
          BACKUP_PATH="d1-backups/fnb-caffe-db-pre-${MIGRATION_FILE_INPUT%.sql}-$(date -u +%Y%m%dT%H%M%SZ).sql"
          echo "Exporting remote D1 backup before migration..."
          npx --no-install wrangler d1 export fnb-caffe-db --remote --output="$BACKUP_PATH" --config worker/wrangler.toml

      - name: Retain pre-migration D1 backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-pre-migration-${{ github.run_id }}
          path: d1-backups/*.sql
          retention-days: 30
          if-no-files-found: error

      - name: Apply explicit forward D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: |
          set -euo pipefail
          PATH="$PWD/node_modules/.bin:$PATH" bash worker/scripts/apply-migrations.sh --remote --file "$MIGRATION_FILE_INPUT"

  deploy-pages:
    name: Deploy Cloudflare Pages
    if: ${{ inputs.action == 'deploy-pages' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Checked-out SHA
        run: |
          echo "Target Release Commit SHA: ${{ github.sha }}"
          echo "Local Checked-out HEAD SHA: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Build frontend
        run: |
          npx --no-install vite build --mode production
          cp robots.txt sitemap.xml dist/ 2>/dev/null || true
          mkdir -p dist/signage && cp -r signage-widgets/*.html dist/signage/ 2>/dev/null || true
          GIT_COMMIT_SHA_FULL=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          GIT_COMMIT_SHORT=$(echo "$GIT_COMMIT_SHA_FULL" | cut -c1-8)
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > dist/version.json << VERSIONEOF
          {
            "sha": "$GIT_COMMIT_SHA_FULL",
            "shortSha": "$GIT_COMMIT_SHORT",
            "buildTime": "$BUILD_TIMESTAMP",
            "deployScript": "github-actions-deploy-pages"
          }
          VERSIONEOF

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: npx --no-install wrangler pages deploy dist --project-name=fnb-caffe-container

  worker-canary:
    name: Worker Canary (10% Traffic)
    if: ${{ inputs.action == 'worker-canary-10' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Checked-out SHA
        run: |
          echo "Candidate Release Commit SHA: ${{ github.sha }}"
          echo "Local Checked-out HEAD SHA: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Link worker module
        run: node -e "const fs = require('fs'); if (!fs.existsSync('node_modules/worker')) fs.symlinkSync('../worker', 'node_modules/worker', 'dir');"

      - name: Install worker dependencies
        run: cd worker && npm ci --silent

      - name: Upload Version and Deploy 10% Canary
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: |
          set -e
          RESOLVED_BASELINE="$BASELINE_VERSION_ID"
          if [ -z "$RESOLVED_BASELINE" ]; then
            echo "Auto-detecting active production Worker baseline version..."
            DEPLOYMENTS_JSON=$(npx --no-install wrangler deployments list --json 2>/dev/null || true)
            RESOLVED_BASELINE=$(printf '%s' "$DEPLOYMENTS_JSON" | node -e "
              const fs = require('fs');
              try {
                const list = JSON.parse(fs.readFileSync(0, 'utf8'));
                const latest = Array.isArray(list) ? list[list.length - 1] : null;
                const ver = latest && Array.isArray(latest.versions) ? latest.versions[0]?.version_id : '';
                if (ver) process.stdout.write(String(ver));
              } catch {}
            ")
          fi
          if ! printf '%s' "$RESOLVED_BASELINE" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Error: could not determine valid active baseline_version_id UUID. Pass baseline_version_id explicitly."
            exit 1
          fi
          echo "Uploading candidate version for SHA ${{ github.sha }}..."
          UPLOAD_OUTPUT=$(npx --no-install wrangler versions upload --message "Candidate SHA ${{ github.sha }}" --var GIT_COMMIT_SHA:${{ github.sha }})
          echo "$UPLOAD_OUTPUT"
          VERSION_ID=$(echo "$UPLOAD_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1)
          if [ -z "$VERSION_ID" ]; then
            echo "Error: Could not extract Worker Version ID from wrangler output"
            exit 1
          fi
          echo "Candidate Version ID: $VERSION_ID"
          echo "Baseline Version ID: $RESOLVED_BASELINE"
          echo "Deploying traffic split: 10% -> $VERSION_ID, 90% -> $RESOLVED_BASELINE"
          npx --no-install wrangler versions deploy "$VERSION_ID@10" "$RESOLVED_BASELINE@90" --yes

  worker-promote:
    name: Worker Promote to 100%
    if: ${{ inputs.action == 'worker-promote-100' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Link worker module
        run: node -e "const fs = require('fs'); if (!fs.existsSync('node_modules/worker')) fs.symlinkSync('../worker', 'node_modules/worker', 'dir');"

      - name: Install worker dependencies
        run: cd worker && npm ci --silent

      - name: Promote Worker Version to 100%
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: |
          set -e
          VERSION_ID="$WORKER_VERSION_ID"
          if [ -z "$VERSION_ID" ]; then
            echo "Error: worker_version_id is required for worker-promote-100"
            exit 1
          fi
          if ! printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Error: invalid worker_version_id UUID format"
            exit 1
          fi
          echo "Promoting Worker Version $VERSION_ID to 100% production traffic..."
          npx --no-install wrangler versions deploy "$VERSION_ID@100" --yes

  worker-rollback:
    name: Worker Rollback
    if: ${{ inputs.action == 'worker-rollback' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Link worker module
        run: node -e "const fs = require('fs'); if (!fs.existsSync('node_modules/worker')) fs.symlinkSync('../worker', 'node_modules/worker', 'dir');"

      - name: Install worker dependencies
        run: cd worker && npm ci --silent

      - name: Rollback Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: |
          set -e
          TARGET_VERSION="${WORKER_VERSION_ID:-$BASELINE_VERSION_ID}"
          if [ -n "$TARGET_VERSION" ]; then
            if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
              echo "Error: invalid rollback target version UUID format"
              exit 1
            fi
            echo "Rolling back Worker to explicit version $TARGET_VERSION..."
            npx --no-install wrangler rollback "$TARGET_VERSION" --message "$ROLLBACK_REASON_INPUT" --yes
          else
            echo "Rolling back Worker to immediately preceding active deployment..."
            npx --no-install wrangler rollback --message "$ROLLBACK_REASON_INPUT" --yes
          fi
