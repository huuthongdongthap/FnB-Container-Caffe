name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: npm ci --silent

    - name: Build frontend
      run: npx vite build --mode production

    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: b69fee03bdd94234eea8e4114cfc36ab
        command: pages deploy dist --project-name=fnb-caffe-container

  deploy-worker:
    runs-on: ubuntu-latest
    needs: deploy-pages
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install worker dependencies
      run: cd worker && npm ci --silent

    - name: Apply D1 migrations
      working-directory: worker
      run: |
        if [[ -d "db/migrations" ]] && [[ -n "$(ls db/migrations/*.sql 2>/dev/null)" ]]; then
          for migration in db/migrations/*.sql; do
            echo "Applying: $(basename "$migration")"
            output=$(npx wrangler d1 execute fnb-caffe-db --file="$migration" --remote 2>&1)
            # D1 lacks ALTER TABLE ADD COLUMN IF NOT EXISTS, so migrations with bare
            # ADD COLUMN error with "duplicate column name" when re-applied. Treat that
            # as success — the schema state is already what the migration intended.
            if [[ $? -ne 0 ]] && ! echo "$output" | grep -q "duplicate column name"; then
              echo "$output" | tail -10
              exit 1
            fi
          done
        else
          echo "No migration files found — skipping."
        fi

    - name: Deploy Worker
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: b69fee03bdd94234eea8e4114cfc36ab
        workingDirectory: worker
        command: deploy
