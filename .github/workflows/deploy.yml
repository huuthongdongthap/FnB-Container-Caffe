name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action to execute'
        required: true
        type: choice
        options:
          - apply-d1-migration
          - deploy-pages
          - worker-canary-10
          - worker-promote-100
          - worker-rollback
        default: worker-canary-10
      migration_file:
        description: 'Canonical forward D1 migration file in worker/db/migrations/ (required when action is apply-d1-migration, e.g. 20261119_02_saas_commercial_v3.sql)'
        required: false
        type: string
        default: ''
      worker_version_id:
        description: 'Candidate Worker Version ID (required for worker-promote-100; optional for specific rollback target)'
        required: false
        type: string
        default: ''
      baseline_version_id:
        description: 'Baseline Worker Version ID for the 90% canary slice. Leave empty to auto-detect the live 100% production version.'
        required: false
        type: string
        default: ''
      rollback_reason:
        description: 'Rollback message/reason (used when action is worker-rollback)'
        required: false
        type: string
        default: 'Manual rollback triggered through GitHub Actions'

# One production rollout at a time; never cancel a half-applied migration or traffic split.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TZ: UTC
  MIGRATION_FILE_INPUT: ${{ inputs.migration_file }}
  BASELINE_VERSION_ID: ${{ inputs.baseline_version_id }}
  WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
  ROLLBACK_REASON_INPUT: ${{ inputs.rollback_reason }}
  CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
  # wrangler is installed only inside worker/node_modules (worker is not an npm workspace),
  # so the repo root has no wrangler binary. Worker steps use working-directory: worker;
  # root-level steps (migration scripts, Pages deploy) prepend worker/node_modules/.bin to PATH.
  WRANGLER_DIR: worker

permissions:
  contents: read

jobs:
  apply-d1-migration:
    name: Backup & Apply Explicit D1 Migration
    if: ${{ inputs.action == 'apply-d1-migration' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root & worker dependencies
        run: |
          npm ci --silent
          cd worker && npm ci --silent

      - name: Validate migration file selection
        run: |
          set -euo pipefail
          if ! printf '%s' "$MIGRATION_FILE_INPUT" | grep -Eq '^[0-9]{8}_[0-9]{2}_[a-z0-9_]+\.sql$'; then
            echo "Error: invalid migration_file format (expected YYYYMMDD_NN_slug.sql)" >&2
            exit 1
          fi
          PATH="$GITHUB_WORKSPACE/worker/node_modules/.bin:$PATH" \
            bash worker/scripts/apply-migrations.sh --dry-run --file "$MIGRATION_FILE_INPUT"

      - name: Export and encrypt pre-migration D1 backup
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_BACKUP_ENCRYPTION_KEY: ${{ secrets.D1_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${D1_BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "Error: D1_BACKUP_ENCRYPTION_KEY secret is required to encrypt pre-migration backups" >&2
            exit 1
          fi
          BACKUP_DIR="$GITHUB_WORKSPACE/d1-backups"
          mkdir -p "$BACKUP_DIR"
          BACKUP_PATH="$BACKUP_DIR/fnb-caffe-db-pre-${MIGRATION_FILE_INPUT%.sql}-$(date -u +%Y%m%dT%H%M%SZ).sql"
          ENCRYPTED_PATH="${BACKUP_PATH}.enc"
          echo "Exporting remote D1 backup before migration..."
          npx --no-install wrangler d1 export fnb-caffe-db --remote --output="$BACKUP_PATH"
          test -s "$BACKUP_PATH"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$BACKUP_PATH" \
            -out "$ENCRYPTED_PATH" \
            -pass env:D1_BACKUP_ENCRYPTION_KEY
          shred -u "$BACKUP_PATH" 2>/dev/null || rm -f "$BACKUP_PATH"
          test -s "$ENCRYPTED_PATH"
          echo "BACKUP_PATH=$ENCRYPTED_PATH" >> "$GITHUB_ENV"

      - name: Upload encrypted pre-migration D1 backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d1-pre-migration-backup-${{ github.run_id }}
          path: d1-backups/*.enc
          if-no-files-found: error
          retention-days: 7

      - name: Apply explicit forward D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PATH="$GITHUB_WORKSPACE/worker/node_modules/.bin:$PATH" \
            bash worker/scripts/apply-migrations.sh --remote --file "$MIGRATION_FILE_INPUT"

  deploy-pages:
    name: Deploy Cloudflare Pages
    if: ${{ inputs.action == 'deploy-pages' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Checked-out SHA
        run: |
          echo "Target Release Commit SHA: ${{ github.sha }}"
          echo "Local Checked-out HEAD SHA: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root and worker dependencies
        run: |
          npm ci --silent
          cd worker && npm ci --silent

      - name: Run Pre-Deploy Quality Gates
        run: |
          npm run lint
          npm run lint:migrations
          npm run check:contrast
          npm run typecheck:all
          npm run test:ci
          node scripts/local-payment-flow/run.mjs --api-only

      - name: Build frontend
        run: |
          npx --no-install vite build --mode production
          cp robots.txt sitemap.xml dist/ 2>/dev/null || true
          mkdir -p dist/signage && cp -r signage-widgets/*.html dist/signage/ 2>/dev/null || true
          GIT_COMMIT_SHA_FULL=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          GIT_COMMIT_SHORT=$(echo "$GIT_COMMIT_SHA_FULL" | cut -c1-8)
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > dist/version.json << VERSIONEOF
          {
            "sha": "$GIT_COMMIT_SHA_FULL",
            "shortSha": "$GIT_COMMIT_SHORT",
            "buildTime": "$BUILD_TIMESTAMP",
            "deployScript": "github-actions-deploy-pages"
          }
          VERSIONEOF

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PATH="$GITHUB_WORKSPACE/worker/node_modules/.bin:$PATH" \
            npx --no-install wrangler pages deploy dist --project-name=fnb-caffe-container --branch=main

  worker-canary:
    name: Worker Canary (10% Traffic)
    if: ${{ inputs.action == 'worker-canary-10' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Checked-out SHA
        run: |
          echo "Candidate Release Commit SHA: ${{ github.sha }}"
          echo "Local Checked-out HEAD SHA: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Link worker module
        run: node -e "const fs = require('fs'); if (!fs.existsSync('node_modules/worker')) fs.symlinkSync('../worker', 'node_modules/worker', 'dir');"

      - name: Install worker dependencies
        run: cd worker && npm ci --silent

      - name: Run pre-canary verification gates
        run: |
          npm run lint
          npm run lint:migrations
          npm run check:contrast
          npm run typecheck:all
          npm run test:ci
          node scripts/local-payment-flow/run.mjs --api-only

      - name: Record pre-canary D1 Time Travel bookmark
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --no-install wrangler d1 time-travel info fnb-caffe-db --json || true

      - name: Resolve baseline version
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          BASELINE="$BASELINE_VERSION_ID"
          if [[ -z "$BASELINE" ]]; then
            echo "baseline_version_id not supplied; detecting live production version..." >&2
            BASELINE="$(npx --no-install wrangler deployments list --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const l=JSON.parse(d);l.sort((a,b)=>Date.parse(b.created_on)-Date.parse(a.created_on));const v=[...(l[0]&&l[0].versions||[])].sort((a,b)=>(b.percentage||0)-(a.percentage||0));process.stdout.write(String(v[0]&&v[0].version_id||''))})")"
          fi
          if ! printf '%s' "$BASELINE" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Error: could not resolve a valid baseline Worker Version ID (got '$BASELINE')" >&2
            exit 1
          fi
          echo "Resolved baseline version: $BASELINE"
          echo "BASELINE_VERSION_ID=$BASELINE" >> "$GITHUB_ENV"

      - name: Upload Version and Deploy 10% Canary
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Uploading candidate version for SHA ${{ github.sha }}..."
          UPLOAD_OUTPUT=$(npx --no-install wrangler versions upload --message "Candidate SHA ${{ github.sha }}" --var GIT_COMMIT_SHA:${{ github.sha }})
          echo "$UPLOAD_OUTPUT"
          VERSION_ID=$(echo "$UPLOAD_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1)
          if [ -z "$VERSION_ID" ]; then
            echo "Error: Could not extract Worker Version ID from wrangler output" >&2
            exit 1
          fi
          if [ "$VERSION_ID" = "$BASELINE_VERSION_ID" ]; then
            echo "Error: candidate version equals baseline version; a canary split would be a no-op" >&2
            exit 1
          fi
          echo "Candidate Version ID: $VERSION_ID"
          echo "Baseline Version ID: $BASELINE_VERSION_ID"
          echo "Deploying traffic split: 10% -> $VERSION_ID, 90% -> $BASELINE_VERSION_ID"
          npx --no-install wrangler versions deploy "$VERSION_ID@10" "$BASELINE_VERSION_ID@90" --yes
          echo "CANARY_VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"

      - name: Report canary candidate version
        run: echo "Canary candidate version $CANARY_VERSION_ID is serving 10% of production traffic."

  worker-promote:
    name: Worker Promote to 100%
    if: ${{ inputs.action == 'worker-promote-100' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Link worker module
        run: node -e "const fs = require('fs'); if (!fs.existsSync('node_modules/worker')) fs.symlinkSync('../worker', 'node_modules/worker', 'dir');"

      - name: Install worker dependencies
        run: cd worker && npm ci --silent

      - name: Promote Worker Version to 100%
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_ID="$WORKER_VERSION_ID"
          if [ -z "$VERSION_ID" ]; then
            echo "Error: worker_version_id is required for worker-promote-100" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Error: invalid worker_version_id UUID format" >&2
            exit 1
          fi
          echo "Promoting Worker Version $VERSION_ID to 100% production traffic..."
          npx --no-install wrangler versions deploy "$VERSION_ID@100" --yes

  worker-rollback:
    name: Worker Rollback
    if: ${{ inputs.action == 'worker-rollback' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Link worker module
        run: node -e "const fs = require('fs'); if (!fs.existsSync('node_modules/worker')) fs.symlinkSync('../worker', 'node_modules/worker', 'dir');"

      - name: Install worker dependencies
        run: cd worker && npm ci --silent

      - name: Rollback Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_VERSION="$WORKER_VERSION_ID"
          if [ -z "$TARGET_VERSION" ]; then
            TARGET_VERSION="$BASELINE_VERSION_ID"
          fi
          if [ -z "$TARGET_VERSION" ]; then
            echo "No explicit target version supplied; rolling back to the previous deployment."
            npx --no-install wrangler rollback --message "$ROLLBACK_REASON_INPUT" --yes
            exit 0
          fi
          if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Error: invalid rollback target version UUID format" >&2
            exit 1
          fi
          echo "Rolling back Worker to version $TARGET_VERSION..."
          npx --no-install wrangler rollback "$TARGET_VERSION" --message "$ROLLBACK_REASON_INPUT" --yes
