name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action to execute'
        required: true
        type: choice
        options:
          - deploy-pages
          - worker-canary-10
          - worker-promote-100
          - worker-rollback
        default: worker-canary-10
      worker_version_id:
        description: 'Candidate Worker Version ID (required for worker-promote-100; optional for specific rollback target)'
        required: false
        type: string
        default: ''
      baseline_version_id:
        description: 'Baseline Worker Version ID for 90% canary or fallback rollback target'
        required: false
        type: string
        default: '33d9e23b-711c-4278-82d1-b8013fedc41a'
      rollback_reason:
        description: 'Rollback message/reason (used when action is worker-rollback)'
        required: false
        type: string
        default: 'Rollback to baseline version 33d9e23b-711c-4278-82d1-b8013fedc41a'

env:
  BASELINE_VERSION_ID: ${{ inputs.baseline_version_id }}
  WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
  ROLLBACK_REASON_INPUT: ${{ inputs.rollback_reason }}

jobs:
  deploy-pages:
    name: Deploy Cloudflare Pages
    if: ${{ inputs.action == 'deploy-pages' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Checked-out SHA
        run: |
          echo "Target Release Commit SHA: ${{ github.sha }}"
          echo "Local Checked-out HEAD SHA: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Build frontend
        run: npx --no-install vite build --mode production

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: npx --no-install wrangler pages deploy dist --project-name=fnb-caffe-container

  worker-canary:
    name: Worker Canary (10% Traffic)
    if: ${{ inputs.action == 'worker-canary-10' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Checked-out SHA
        run: |
          echo "Candidate Release Commit SHA: ${{ github.sha }}"
          echo "Local Checked-out HEAD SHA: $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Link worker module
        run: node -e "const fs = require('fs'); if (!fs.existsSync('node_modules/worker')) fs.symlinkSync('../worker', 'node_modules/worker', 'dir');"

      - name: Install worker dependencies
        run: cd worker && npm ci --silent

      - name: Upload Version and Deploy 10% Canary
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: |
          set -e
          if ! printf '%s' "$BASELINE_VERSION_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Error: invalid baseline_version_id UUID format"
            exit 1
          fi
          echo "Uploading candidate version for SHA ${{ github.sha }}..."
          UPLOAD_OUTPUT=$(npx --no-install wrangler versions upload --message "Candidate SHA ${{ github.sha }}" --var GIT_COMMIT_SHA:${{ github.sha }})
          echo "$UPLOAD_OUTPUT"
          VERSION_ID=$(echo "$UPLOAD_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1)
          if [ -z "$VERSION_ID" ]; then
            echo "Error: Could not extract Worker Version ID from wrangler output"
            exit 1
          fi
          echo "Candidate Version ID: $VERSION_ID"
          echo "Baseline Version ID: $BASELINE_VERSION_ID"
          echo "Deploying traffic split: 10% -> $VERSION_ID, 90% -> $BASELINE_VERSION_ID"
          npx --no-install wrangler versions deploy "$VERSION_ID@10" "$BASELINE_VERSION_ID@90" --yes

  worker-promote:
    name: Worker Promote to 100%
    if: ${{ inputs.action == 'worker-promote-100' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Link worker module
        run: node -e "const fs = require('fs'); if (!fs.existsSync('node_modules/worker')) fs.symlinkSync('../worker', 'node_modules/worker', 'dir');"

      - name: Install worker dependencies
        run: cd worker && npm ci --silent

      - name: Promote Worker Version to 100%
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: |
          set -e
          VERSION_ID="$WORKER_VERSION_ID"
          if [ -z "$VERSION_ID" ]; then
            echo "Error: worker_version_id is required for worker-promote-100"
            exit 1
          fi
          if ! printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Error: invalid worker_version_id UUID format"
            exit 1
          fi
          echo "Promoting Worker Version $VERSION_ID to 100% production traffic..."
          npx --no-install wrangler versions deploy "$VERSION_ID@100" --yes

  worker-rollback:
    name: Worker Rollback
    if: ${{ inputs.action == 'worker-rollback' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install root dependencies
        run: npm ci --silent

      - name: Link worker module
        run: node -e "const fs = require('fs'); if (!fs.existsSync('node_modules/worker')) fs.symlinkSync('../worker', 'node_modules/worker', 'dir');"

      - name: Install worker dependencies
        run: cd worker && npm ci --silent

      - name: Rollback Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b69fee03bdd94234eea8e4114cfc36ab
        run: |
          set -e
          TARGET_VERSION="${WORKER_VERSION_ID:-$BASELINE_VERSION_ID}"
          if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Error: invalid rollback target version UUID format"
            exit 1
          fi
          echo "Rolling back Worker to version $TARGET_VERSION..."
          npx --no-install wrangler rollback "$TARGET_VERSION" --message "$ROLLBACK_REASON_INPUT" --yes
