<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-card {
        background: rgba(22, 32, 47, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(198, 198, 199, 0.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .bronze-glow {
        box-shadow: 0px 0px 15px rgba(212, 165, 116, 0.3);
      }
      .scan-frame {
        position: relative;
        width: 180px;
        height: 180px;
      }
      .scan-frame::before, .scan-frame::after, 
      .scan-frame span::before, .scan-frame span::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        border-color: #c6c6c7;
        border-style: solid;
      }
      .scan-frame::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
      .scan-frame::after { top: 0; right: 0; border-width: 2px 2px 0 0; }
      .scan-frame span::before { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
      .scan-frame span::after { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
      
      .animated-pulse-slow {
        animation: pulse-slow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-slow {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.3; }
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen font-body-md selection:bg-primary/30">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-white/10 flex justify-between items-center px-margin-mobile h-16 shadow-[0px_0px_15px_rgba(212,165,116,0.1)]">
<div class="flex items-center gap-4">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tighter">AURA CAFE</h1>
</div>
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<main class="pt-24 pb-32 px-margin-mobile max-w-md mx-auto">
<!-- Ambient Background Decoration -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-[100px] animated-pulse-slow"></div>
<div class="absolute top-1/2 -left-32 w-80 h-80 bg-tertiary/5 rounded-full blur-[120px] animated-pulse-slow" style="animation-delay: 2s"></div>
</div>
<!-- Hero Glass Card -->
<section class="glass-card rounded-xl p-8 mb-8 relative overflow-hidden">
<div class="relative z-10">
<p class="font-label-caps text-label-caps text-primary mb-2">LOYALTY PROGRAM</p>
<h2 class="font-headline-md text-headline-md text-on-surface mb-4">Check-In</h2>
<p class="font-body-md text-on-surface-variant leading-relaxed">
                    Welcome back to Aura. Enter your mobile number to earn <span class="text-primary font-bold">Aura Points</span> for your visit today.
                </p>
</div>
<!-- Decorative industrial line -->
<div class="absolute right-0 top-0 h-full w-1 bg-gradient-to-b from-transparent via-primary/20 to-transparent"></div>
</section>
<!-- Input Section -->
<section class="space-y-6 mb-12">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-secondary block ml-1" for="phone">PHONE NUMBER</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-b border-secondary/30 focus:border-primary text-on-surface py-4 px-1 font-mono-data text-xl outline-none transition-all placeholder:text-on-surface-variant/30" id="phone" placeholder="(000) 000-0000" type="tel"/>
<div class="absolute right-0 bottom-4 text-primary/40">
<span class="material-symbols-outlined">phone_iphone</span>
</div>
</div>
</div>
<button class="w-full py-5 bg-primary-container text-on-primary-fixed font-headline-md text-headline-md rounded-lg bronze-glow hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                Check-In & Earn Points
                <span class="material-symbols-outlined">chevron_right</span>
</button>
</section>
<!-- QR Divider -->
<div class="flex items-center gap-4 mb-12">
<div class="h-[1px] flex-1 bg-white/10"></div>
<span class="font-label-caps text-label-caps text-secondary/50">OR SCAN CODE</span>
<div class="h-[1px] flex-1 bg-white/10"></div>
</div>
<!-- QR Scanner Viewfinder -->
<section class="flex flex-col items-center">
<div class="scan-frame flex items-center justify-center glass-card rounded-lg overflow-hidden group">
<span class="absolute inset-0 pointer-events-none"></span>
<div class="w-full h-full relative">
<img class="w-full h-full object-cover opacity-60 grayscale hover:grayscale-0 transition-all duration-700" data-alt="A macro close-up of a technical smartphone screen displaying a complex geometric QR code. The surrounding environment is a dimly lit, high-end industrial cafe with brushed metal surfaces and warm bronze lighting. The focus is sharp on the digital pixels of the code, while the background bokeh shows hints of espresso machines and architectural glass. Deep navy and metallic chrome tones dominate the cinematic composition." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUzz6Ndzmf_7DYvRwfw0dyyAdr258WHDlCKJLLtVur7Jc98y6A8oAQC21wLKBwsPauaFdnzKIa59vNDZd6G04BjsXA73U-aklpE6pK0jJ2z-eXD6cilqtdUbSzBwQQgeJTV9DY6RPt5P3ZR6phG_Nhh7MCvToNNE98kPjFUwQmdSEksj8e_64BDymYs1v2b7kXbYC9y40_uD2R0J4a1cDQMHIMooUwxMC74y8YZOp-qSk2pWFDaPDIg723owN6fZMKoOhm9QxQEr4"/>
<!-- Scanner Laser Line -->
<div class="absolute left-0 w-full h-[2px] bg-primary shadow-[0px_0px_10px_#f2c08d] animate-[scan_3s_ease-in-out_infinite]"></div>
</div>
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
</div>
<p class="mt-6 font-label-caps text-label-caps text-secondary text-center tracking-widest">POSITION QR CODE IN FRAME</p>
</section>
</main>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-margin-mobile py-4 bg-surface-container/90 backdrop-blur-xl border-t border-chrome/20 z-50">
<a class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:text-primary transition-colors active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full p-3 shadow-[0px_0px_12px_rgba(212,165,116,0.4)] active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:text-primary transition-colors active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">history</span>
</a>
</nav>
<style>
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
    </style>
<script>
        // Simple micro-interaction for input focus
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('focus', () => {
            phoneInput.parentElement.classList.add('border-primary');
        });
        phoneInput.addEventListener('blur', () => {
            if (!phoneInput.value) phoneInput.parentElement.classList.remove('border-primary');
        });

        // Basic formatting for phone number
        phoneInput.addEventListener('input', (e) => {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
</body></html>
