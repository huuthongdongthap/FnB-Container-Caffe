<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AURA CAFE | Admin Terminal</title>
<!-- Google Fonts -->

                    "on-background": "#e4e2e4",
                    "secondary-fixed-dim": "#c2c6d2",
                    "surface-container": "#1f1f21",
                    "on-primary": "#223146",
                    "on-tertiary-container": "#9c7c5a",
                    "surface-variant": "#343536",
                    "error": "#ffb4ab",
                    "on-surface-variant": "#c5c6cd",
                    "on-surface": "#e4e2e4",
                    "secondary": "#c2c6d2",
                    "on-secondary-container": "#b0b5c1",
                    "surface-tint": "#b8c7e2",
                    "on-secondary-fixed": "#161c24",
                    "on-primary-fixed": "#0c1c30",
                    "tertiary-container": "#281500",
                    "on-tertiary-fixed-variant": "#5c4224",

                    "surface-container-high": "#292a2c",
                    "inverse-surface": "#e4e2e4",
                    "tertiary-fixed-dim": "#e5c099",
                    "surface-bright": "#39393b",
                    "on-error": "#690005",
                    "on-primary-container": "#74839c",
                    "on-tertiary": "#432c10",
                    "tertiary-fixed": "#ffddba",
                    "primary": "#b8c7e2",
                    "surface-container-lowest": "#0e0e10",
                    "primary-fixed": "#d4e3ff",
                    "primary-container": "#0a1a2e",
                    "surface-dim": "#131315",
                    "outline": "#8e9097",
                    "surface-container-low": "#1b1b1d",
                    "on-tertiary-fixed": "#2b1701",

            },
            "borderRadius": {

      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        
        .chrome-gradient-bg {
            background: linear-gradient(135deg, #CFD8DC 0%, #90A4AE 50%, #546E7A 100%);
        }
        
        .chrome-border {
            border: 1px solid transparent;
            background: linear-gradient(#131315, #131315) padding-box,
                        linear-gradient(135deg, #ffffff44 0%, #ffffff11 50%, #ffffff44 100%) border-box;
        }

        .chrome-line {
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, #ffffff44 50%, transparent 100%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        /* Subtle ambient glow effect */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(184, 199, 226, 0.05) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        
        input:focus {
            outline: none !important;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-[#0A1A2E] min-h-screen flex items-center justify-center font-body-lg text-on-surface selection:bg-primary/30 relative overflow-hidden">
<!-- Background Elements -->
<div class="ambient-glow -top-48 -left-48"></div>
<div class="ambient-glow -bottom-48 -right-48"></div>
<!-- Top Nav Shell (Static/Decorative for Login) -->
<header class="fixed top-0 left-0 w-full flex justify-between items-center px-margin-desktop py-lg z-50">
<div class="font-display-logo text-display-logo text-primary tracking-wider">AURA CAFE</div>
<div class="flex gap-md">
<span class="material-symbols-outlined text-primary cursor-pointer transition-all active:scale-95" data-icon="support_agent">support_agent</span>
<span class="material-symbols-outlined text-primary cursor-pointer transition-all active:scale-95" data-icon="dark_mode">dark_mode</span>
</div>
</header>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-[440px] px-margin-mobile md:px-0">
<div class="glass-panel chrome-border rounded-lg p-xl flex flex-col items-center">
<!-- Brand Identity -->
<div class="text-center mb-xl">
<h1 class="font-display-logo text-display-logo text-primary tracking-[0.3em] mb-xs uppercase">AURA CAFE</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Admin Terminal Access</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-lg" id="loginForm">
<!-- Email Field -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant px-xs" for="email">Credentials</label>
<div class="relative">
<input class="w-full bg-[#050D17] border-0 border-b-[0.5px] border-white/20 text-on-surface px-md py-md font-body-sm tracking-widest placeholder:text-outline/40 transition-all focus:border-primary" id="email" placeholder="OPERATOR ID / EMAIL" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center px-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Security Key</label>
</div>
<div class="relative group">
<input class="w-full bg-[#050D17] border-0 border-b-[0.5px] border-white/20 text-on-surface px-md py-md font-body-sm tracking-widest placeholder:text-outline/40 transition-all focus:border-primary" id="password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-md">
<button class="w-full chrome-gradient-bg py-md rounded-lg text-[#0A1A2E] font-headline-md uppercase tracking-widest hover:brightness-110 active:scale-[0.98] transition-all shadow-xl shadow-primary/5" type="submit">
                        Initialize Session
                    </button>
</div>
</form>
<!-- Links -->
<div class="w-full mt-lg text-center">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors duration-300 uppercase" href="#">Quen mat khau?</a>
</div>
<!-- Divider -->
<div class="w-full my-xl chrome-line"></div>
<!-- Secondary Actions -->
<div class="flex flex-col gap-md w-full text-center">
<button class="font-label-caps text-label-caps text-primary/60 hover:text-primary transition-all tracking-[0.2em] uppercase">
                    Enter as Guest
                </button>
<button class="font-label-caps text-label-caps text-outline hover:text-on-surface transition-all tracking-[0.2em] uppercase">
                    Contact System Support
                </button>
</div>
</div>
</main>
<!-- Footer Shell -->
<footer class="fixed bottom-0 left-0 w-full flex justify-between items-center px-margin-desktop py-lg pointer-events-none">
<div class="font-label-caps text-label-caps text-on-surface-variant">© 2024 AURA CAFE INDUSTRIAL LUXE</div>
<div class="flex gap-lg pointer-events-auto">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy</a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Terms</a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Security</a>
</div>
</footer>
<!-- Micro-interactions & Logic -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Add subtle mouse move effect on the glass panel
        const container = document.querySelector('.glass-panel');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            container.style.transform = `perspective(1000px) rotateX(${-y}deg) rotateY(${x}deg)`;
        });

        // Form submission animation
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = 'Authorized';
                btn.classList.add('bg-green-400');
                // Normally here we would redirect
            }, 1500);
        });
    </script>
</body></html>
