<div class="fixed inset-0 -z-10 pointer-events-none opacity-40">

</div>
<!-- Micro-interaction Scripts -->
<script>
        document.querySelectorAll('input, textarea').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Toggle payment selection styling
        const paymentRadios = document.querySelectorAll('input[name="payment"]');
        paymentRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                document.querySelectorAll('input[name="payment"]').forEach(r => {
                    const parent = r.nextElementSibling;
                    if(r.checked) {
                        parent.classList.add('bronze-glow', 'border-tertiary');
                    } else {
                        parent.classList.remove('bronze-glow', 'border-tertiary');
                    }
                });
            });
        });
    </script>
